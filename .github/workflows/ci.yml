name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the library
        run: pnpm build
      - name: Smoke-test the built CLI (0 = faithful, 1 = unfaithful)
        run: |
          node dist/cli/main.js check examples/incident.source.txt examples/incident.faithful.txt --quiet
          set +e
          node dist/cli/main.js check examples/incident.source.txt examples/incident.unfaithful.txt --quiet
          test $? -eq 1
      - name: Committed benchmark matches the code
        run: pnpm bench:check
      - name: Build the playground
        run: pnpm build:playground
